[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W: estilo, F: errores reales, I: orden de imports, B: errores comunes.
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
# importlib permite archivos de prueba con el mismo nombre en carpetas distintas.
addopts = "--import-mode=importlib"
